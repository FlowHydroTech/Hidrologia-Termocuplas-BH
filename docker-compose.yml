# ═══════════════════════════════════════════════════════════════════
# docker-compose.yml — Hatch-Amplitude Pipeline + Prefect Dashboard
# ═══════════════════════════════════════════════════════════════════
#
# Modos de uso:
#
#   1) Pipeline + Dashboard Prefect (completo):
#      docker compose up
#
#   2) Solo pipeline con Prefect (sin dashboard local):
#      docker compose up pipeline
#
#   3) Pipeline Python puro (sin Prefect):
#      docker compose run --rm standalone
#
#   4) Solo dashboard Prefect:
#      docker compose up prefect
#
# Acceder al dashboard: http://localhost:4200
# ═══════════════════════════════════════════════════════════════════

services:
  # --- Prefect Server (Dashboard) ---
  prefect:
    image: prefecthq/prefect:3-python3.12
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    environment:
      PREFECT_SERVER_API_HOST: "0.0.0.0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- Pipeline con Prefect (conecta al dashboard) ---
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      prefect:
        condition: service_healthy
    environment:
      PREFECT_API_URL: "http://prefect:4200/api"
    volumes:
      - ./data:/app/data
    working_dir: /app
    command: ["scripts/prefect_pipeline.py"]

  # --- Pipeline Python puro (sin Prefect ni servidor) ---
  standalone:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./data:/app/data
    working_dir: /app
    command: ["scripts/run_pipeline.py"]
    profiles:
      - standalone
